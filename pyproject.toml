[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-banking"
version = "0.1.0"
description = "A competition project for a simulated banking agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_banking = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
