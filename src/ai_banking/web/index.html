<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f5f2">
    <title>澄明银行 · 智能金融工作台</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="/" aria-label="澄明银行总览">
          <span class="brand-mark" aria-hidden="true">澄</span>
          <span class="brand-copy">
            <strong>澄明银行</strong>
            <small>PERSONAL BANKING</small>
          </span>
        </a>
        <div class="workspace-label">个人工作台</div>
        <nav class="primary-nav">
          <button class="nav-item active" data-view="overview"><span>◫</span>总览</button>
          <button class="nav-item" data-view="transfer"><span>⇄</span>转账与收款</button>
          <button class="nav-item" data-view="bills"><span>▤</span>账单分析</button>
          <button class="nav-item" data-view="investments"><span>↗</span>理财投资</button>
          <button class="nav-item" data-view="cards"><span>▣</span>卡片管理</button>
          <button class="nav-item" data-view="subscriptions"><span>↻</span>订阅管理</button>
          <button class="nav-item" data-view="birthday"><span>✳</span>生日联动</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="local-status"><span class="status-dot"></span><span>本地演示环境</span></div>
          <p>账户、交易与操作均为模拟数据</p>
          <button class="reset-button" data-action="reset">重置演示数据</button>
          <div class="profile-row">
            <span class="avatar">知</span>
            <span><strong>林知夏</strong><small>个人账户</small></span>
            <span class="profile-menu" aria-hidden="true">···</span>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark">澄</span><strong>澄明银行</strong></div>
          <div class="breadcrumb"><span>个人工作台</span><span class="crumb-divider">/</span><strong id="view-label">总览</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="icon-button notification-button" data-action="notifications" aria-label="通知" title="通知">♧<i></i></button>
            <span class="top-avatar">知</span>
          </div>
        </header>

        <div class="workspace-grid">
          <main class="main-content" id="main-content" tabindex="-1">
            <div class="loading-state">正在载入账户概览…</div>
          </main>
          <aside class="assistant-panel" aria-label="智能助理">
            <div class="assistant-head">
              <div class="assistant-avatar"><span>✳</span></div>
              <div class="assistant-title">
                <strong>澄明 AI 助理</strong>
                <span><i class="status-dot"></i>在线</span>
              </div>
              <button class="icon-button clear-chat" data-action="clear-chat" title="清空对话" aria-label="清空对话">⌫</button>
            </div>
            <div class="assistant-context" id="assistant-context">演示账户 · 林知夏</div>
            <div class="chat-messages" id="chat-messages" aria-live="polite">
              <div class="message assistant-message">
                <p>早上好，知夏。今天想先处理哪件事？</p>
                <time>刚刚</time>
              </div>
            </div>
            <div class="suggestion-area" id="suggestion-area">
              <span class="suggestion-label">试试这样说</span>
              <div class="suggestion-list">
                <button class="suggestion-chip" data-prompt="分析本月账单并检查异常交易">分析本月账单</button>
                <button class="suggestion-chip" data-prompt="比较适合稳健型的理财产品">比较理财产品</button>
                <button class="suggestion-chip" data-prompt="转 88 元给周明">转账给周明</button>
              </div>
            </div>
            <form class="chat-composer" id="chat-form">
              <label class="sr-only" for="chat-input">输入金融需求</label>
              <textarea id="chat-input" rows="2" maxlength="2000" placeholder="描述你想办理的业务…" required></textarea>
              <div class="composer-footer">
                <span class="local-lock"><span aria-hidden="true">⌑</span>仅本机模拟</span>
                <button class="send-button" type="submit" aria-label="发送消息" title="发送消息">↑</button>
              </div>
            </form>
            <div class="assistant-footnote">重要资金操作均需你确认后执行</div>
          </aside>
        </div>
      </div>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
  </body>
</html>
